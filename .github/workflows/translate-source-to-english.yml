name: Translate reporter source to English

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/translate-source-to-english.yml'

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Translate source and runtime defaults
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('syncthing/syncthing_reporter_py/report.py')
          text = p.read_text(encoding='utf-8')

          replacements = [
              ('# ------------------------ Konfiguration ------------------------', '# ------------------------ Configuration ------------------------'),
              ('REPORT_LANG = os.getenv("REPORT_LANG", "de").strip().lower()', 'REPORT_LANG = os.getenv("REPORT_LANG", "en").strip().lower()'),
              ('if REPORT_LANG not in ("de", "en"):\n    REPORT_LANG = "de"', 'if REPORT_LANG not in ("de", "en"):\n    REPORT_LANG = "en"'),
              ('# Persistenter Cache', '# Persistent cache'),
              ('I18N.get(REPORT_LANG, I18N["de"])', 'I18N.get(REPORT_LANG, I18N["en"])'),
              ('# tz-aware UTC (Python 3.12+ Empfehlung)', '# timezone-aware UTC (Python 3.12+ recommendation)'),
              ('# behandle alte Einträge ohne TZ als UTC', '# treat legacy entries without timezone information as UTC'),
              ('# ------------------------ HTML & Versand ------------------------', '# ------------------------ HTML & delivery ------------------------'),
              ('    """Rendert eine Outlook-freundliche HTML-Mail im Stil des Nextcloud-Reports.\n\n    Wichtig für Outlook Dark Mode: Der HTML-Code ist bewusst als schlanker\n    Mail-Body ohne erzwungenen dunklen Seitenhintergrund aufgebaut. Genau wie\n    beim Nextcloud-entrypoint kann Outlook die hellen Tabellen-/Rahmenfarben\n    dadurch sauber in den Dark Mode umsetzen.\n    """', '    """Render an Outlook-friendly HTML message using the Nextcloud report style.\n\n    For Outlook Dark Mode, the HTML intentionally uses a lightweight mail body\n    without forcing a dark page background. This allows Outlook to invert the\n    light table and border colors cleanly, matching the Nextcloud entrypoint.\n    """'),
              ('    # Palette absichtlich wie im nc_inotify_sync-entrypoint: helle Mailfarben,\n    # damit Outlook Desktop sie im Dark Mode selbst invertieren kann.', '    # Intentionally use the same light mail palette as the nc_inotify_sync entrypoint\n    # so Outlook Desktop can invert it automatically in Dark Mode.'),
              ('        status_title = "Mit Fehlern" if has_errors else "OK"', '        status_title = tr("status_with_errors") if has_errors else tr("status_ok")'),
              ('        action_header = "Aktion" if REPORT_LANG == "de" else "Action"', '        action_header = tr("action")'),
              ('  <div style="margin:0 0 12px 0; color:{C[\'muted\']}; font-size:13px;">Erstellt: {esc(header_meta)} · Zeitraum: letzte {esc(window_hours)}h</div>', '  <div style="margin:0 0 12px 0; color:{C[\'muted\']}; font-size:13px;">{esc(tr("header_meta", meta=header_meta, hours=window_hours))}</div>'),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected source fragment not found: {old[:120]!r}')
              text = text.replace(old, new)

          de_anchor = '        "path_empty": "Keine Einträge",\n'
          en_anchor = '        "path_empty": "No entries",\n'
          if de_anchor not in text or en_anchor not in text:
              raise SystemExit('I18N insertion anchor not found')
          text = text.replace(de_anchor, de_anchor + '        "status_with_errors": "Mit Fehlern",\n        "status_ok": "OK",\n        "action": "Aktion",\n        "header_meta": "Erstellt: {meta} · Zeitraum: letzte {hours}h",\n', 1)
          text = text.replace(en_anchor, en_anchor + '        "status_with_errors": "With errors",\n        "status_ok": "OK",\n        "action": "Action",\n        "header_meta": "Created: {meta} · Period: last {hours}h",\n', 1)

          p.write_text(text, encoding='utf-8')
          PY

          python3 -m py_compile syncthing/syncthing_reporter_py/report.py
          for f in syncthing/scripts/*.sh syncthing/syncthing_reporter_py/*.sh; do
            sh -n "$f"
          done

          cp syncthing/.env.example syncthing/.env
          (cd syncthing && docker compose config >/dev/null)
          rm -f syncthing/.env

      - name: Audit remaining German source text
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          terms = re.compile(r'\b(Deutsch|Sprache|Konfiguration|Persistenter|Empfehlung|behandle|Versand|Rendert|Wichtig|absichtlich|damit|Ordner|Fehler|Änder\w*|Hinzugefügt|Gelöscht|Verzeichnisse|Gesamtgröße|Ausstehend|Zugriff|Beispiel|Erstellt|Zeitraum|letzte|Aktion|unbekannt|pausiert|Einträge|Weitere|Erforderlich|Benachrichtigung|Passwort|Absender|Empfänger)\b', re.IGNORECASE)
          suffixes = {'.md', '.py', '.sh', '.yaml', '.yml', '.txt', '.example', '.dockerignore', '.gitattributes', '.gitignore'}
          problems = []

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.name == 'README.DE.md' or path.suffix.lower() not in suffixes:
                  continue
              try:
                  lines = path.read_text(encoding='utf-8').splitlines()
              except Exception:
                  continue

              in_de_i18n = False
              for lineno, line in enumerate(lines, 1):
                  if path.name == 'report.py':
                      if line.strip() == '"de": {':
                          in_de_i18n = True
                          continue
                      if in_de_i18n and line.strip() == '},':
                          in_de_i18n = False
                          continue
                      if in_de_i18n:
                          continue
                  if terms.search(line):
                      problems.append(f'{path}:{lineno}: {line}')

          if problems:
              print('Remaining German-looking source text outside the intentional German I18N block:')
              print('\n'.join(problems))
              raise SystemExit(1)
          print('German source-text audit passed.')
          PY

      - name: Commit changes and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/translate-source-to-english.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add syncthing/syncthing_reporter_py/report.py .github/workflows/translate-source-to-english.yml
          git commit -m "Translate reporter source and defaults to English"
          git push origin main
